name: local-ci

run-name: local-ci ${{ github.event.client_payload.snapshot_id || github.run_id }} ${{ github.event.client_payload.dispatch_id || 'manual' }}

on:
  repository_dispatch:
    types: [family-build]
  workflow_dispatch:
    inputs:
      mode:
        description: Build own revision or revalidate dependencies
        type: choice
        options: [own, dependency]
        default: own

permissions:
  contents: read

concurrency:
  group: local-ci-${{ github.repository }}-${{ github.event.client_payload.snapshot_id || github.run_id }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

jobs:
  snapshot:
    name: snapshot-contract
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.snapshot.outputs.mode }}
      snapshot_id: ${{ steps.snapshot.outputs.snapshot_id }}
      snapshot_json: ${{ steps.snapshot.outputs.snapshot_json }}
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
      source_sha: ${{ steps.snapshot.outputs.source_sha }}
    steps:
      - name: Resolve family controller revision
        id: controller_revision
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              raise SystemExit(1)

          def require_sha(value):
              if not isinstance(value, str) or re.fullmatch(r"[0-9a-fA-F]{40}", value) is None:
                  fail("Invalid repository_dispatch snapshot.cxetcpp.")
              return value

          event_name = os.environ["GITHUB_EVENT_NAME"]
          if event_name == "workflow_dispatch":
              controller_ref = "main"
          elif event_name == "repository_dispatch":
              try:
                  event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as exc:
                  fail(f"Cannot read repository_dispatch payload: {exc}")
              if not isinstance(event, dict) or not isinstance(event.get("client_payload"), dict):
                  fail("repository_dispatch client_payload is required.")
              snapshot = event["client_payload"].get("snapshot")
              if not isinstance(snapshot, dict):
                  fail("repository_dispatch snapshot is required.")
              controller_ref = require_sha(snapshot.get("cxetcpp"))
          else:
              fail(f"Unsupported local-ci event: {event_name}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ref={controller_ref}\n")
          PY

      - name: Checkout family revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ steps.controller_revision.outputs.ref }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: controller
          sparse-checkout: |
            .github/actions/resolve-family-revisions
            tools/Ci
          persist-credentials: false
      - name: Resolve current family mains for a manual run
        if: github.event_name == 'workflow_dispatch'
        id: fallback
        uses: ./controller/.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      - name: Validate immutable family snapshot
        id: snapshot
        env:
          CLIENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          MANUAL_MODE: ${{ inputs.mode }}
          FALLBACK_JSON: >-
            {"cxetcpp":"${{ steps.fallback.outputs.cxetcpp_sha }}","hft_parser":"${{ steps.fallback.outputs.hft_parser_sha }}","hft_compressor":"${{ steps.fallback.outputs.hft_compressor_sha }}","hft_recorder":"${{ steps.fallback.outputs.hft_recorder_sha }}","trading_core":"${{ steps.fallback.outputs.trading_core_sha }}","hft_trader":"${{ steps.fallback.outputs.hft_trader_sha }}","hft_backtest":"${{ steps.fallback.outputs.hft_backtest_sha }}","trader":"${{ steps.fallback.outputs.trader_sha }}","vetron":"${{ steps.fallback.outputs.vetron_sha }}","test_exchanges_helper":"${{ steps.fallback.outputs.test_exchanges_helper_sha }}"}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          keys = {"cxetcpp", "hft_parser", "hft_compressor", "hft_recorder", "trading_core", "hft_trader", "hft_backtest", "trader", "vetron", "test_exchanges_helper"}
          repositories = {"CXETCPP", "TestExchangesHelper", "hft-compressor", "hft-recorder", "hft-parser", "trading-core", "hft-trader", "hft-backtest", "trader", "vetron"}
          if os.environ["GITHUB_EVENT_NAME"] == "repository_dispatch":
              payload = json.loads(os.environ["CLIENT_PAYLOAD"])
              if payload.get("schema_version") not in (2, 3):
                  raise SystemExit("family-build requires schema_version=2 or 3")
              mode, snapshot, snapshot_id = payload.get("mode"), payload.get("snapshot"), payload.get("snapshot_id")
              if payload.get("trigger_repo") not in repositories or not re.fullmatch(r"[0-9a-f]{40}", str(payload.get("trigger_sha", ""))):
                  raise SystemExit("family-build contains an invalid trigger")
          else:
              mode, snapshot = os.environ.get("MANUAL_MODE") or "own", json.loads(os.environ["FALLBACK_JSON"])
              relevant = {key: snapshot[key] for key in ("cxetcpp", "test_exchanges_helper")}
              snapshot_id = hashlib.sha256(json.dumps(relevant, sort_keys=True, separators=(",", ":")).encode()).hexdigest()[:16]
          if mode not in {"own", "dependency"} or not isinstance(snapshot, dict) or set(snapshot) != keys:
              raise SystemExit("invalid family-build mode or repository set")
          if any(not isinstance(v, str) or not re.fullmatch(r"[0-9a-f]{40}", v) for v in snapshot.values()):
              raise SystemExit("family-build contains an invalid SHA")
          if not isinstance(snapshot_id, str) or not re.fullmatch(r"[0-9a-f]{16}", snapshot_id):
              raise SystemExit("snapshot_id must be a 16-character lowercase digest")
          compact = json.dumps(snapshot, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              print(f"mode={mode}\nsnapshot_id={snapshot_id}\nsnapshot_json={compact}", file=out)
              print(f"cxetcpp_sha={snapshot['cxetcpp']}\nsource_sha={snapshot['test_exchanges_helper']}", file=out)
          PY
      - name: Claim current dispatched snapshot
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_ID: ${{ github.event.client_payload.dispatch_id }}
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ steps.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py claim
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --dispatch-id "$DISPATCH_ID"

  prepare:
    name: prepare-incremental-trees
    needs: snapshot
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 45
    defaults:
      run:
        shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Checkout exact family root without cleaning build outputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: source/family-ci-v3/CXETCPP
          submodules: false
          clean: false
          persist-credentials: false
      - name: Restore pinned source graph without shallow history
        working-directory: source/family-ci-v3/CXETCPP
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.CI_FAMILY_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_0: 'git@github.com:'
          GIT_CONFIG_KEY_1: 'url.https://x-access-token:${{ secrets.CI_FAMILY_READ_TOKEN }}@github.com/.insteadOf'
          GIT_CONFIG_VALUE_1: 'https://github.com/'
        run: |
          bash "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/RestoreFamilySubmodules.sh" tools/exchange_api_probe apps/hft-compressor apps/hft-recorder apps/hft-parser apps/trading-core apps/hft-trader apps/hft-backtest apps/trader apps/vetron extra/abseil-cpp extra/liburing extra/secp256k1 extra/wolfssl
      - name: Overlay exact TestExchangesHelper snapshot
        uses: ./source/family-ci-v3/CXETCPP/.github/actions/overlay-family-revision
        with:
          source-root: source/family-ci-v3/CXETCPP
          repository-path: tools/exchange_api_probe
          repository: be0hhh/TestExchangesHelper
          revision: ${{ fromJSON(needs.snapshot.outputs.snapshot_json).test_exchanges_helper }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
      - name: Set up pinned LLVM
        uses: ./source/family-ci-v3/CXETCPP/.github/actions/setup-toolchain
        with:
          source-root: source/family-ci-v3/CXETCPP
          local-cache-root: /home/gha-runner/github-actions/cache/toolchains/wsl-ci-cxetcpp
      - name: Configure persistent root-integration tree
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          /usr/bin/cmake --preset clang-ci-family-incremental -DCXET_EXCHANGE_FEED_RACE_BUILD=ON
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" record --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"

  production-build:
    name: production-build / standalone
    if: needs.snapshot.outputs.mode == 'own'
    needs: [snapshot, prepare]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 120
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Build standalone production tools
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --target exchange-api-probe binance-ws-race --parallel 4

  root-integration-build:
    name: root-integration-build / exchange-feed-race
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.production-build.result == 'success' || needs.production-build.result == 'skipped')
    needs: [snapshot, prepare, production-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 180
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
      FAMILY_REPOSITORY_SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
      GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
    steps:
      - name: Build root-integrated probe products
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --parallel 4 --target exchange-api-probe exchange-feed-race exchange-bbo-reconstruction-probe
          python3 tools/Ci/FamilyCiController.py stage-artifact --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --snapshot-id "$FAMILY_REPOSITORY_SNAPSHOT_ID" --artifact-path "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"

  test-build:
    name: test-build
    needs: [snapshot, root-integration-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.root-integration-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 180
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Build standalone offline tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --parallel 4 --target exchange-probe-cli-tests exchange-probe-rest-contract-tests exchange-probe-ws-contract-tests exchange-probe-redaction-tests exchange-probe-gzip-tests exchange-probe-compare-tests exchange-probe-research-tests binance-ws-race
      - name: Build root integration tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-incremental --parallel 4 --target exchange-bbo-reconstruction-tests exchange-feed-race-contract-tests exchange-feed-race-semantics-tests exchange-feed-race-catalog-tests exchange-feed-race-transport-tests exchange-feed-race-venue-tests exchange-feed-race-report-tests

  protocol-tests:
    name: tests / protocol-contracts
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 30
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run standalone CLI, REST, and WebSocket contracts
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^(exchange-probe-(cli|rest-contract|ws-contract)-tests)$'

  safety-tests:
    name: tests / redaction-and-codecs
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 30
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run redaction and gzip tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^(exchange-probe-(redaction|gzip)-tests)$'

  research-tests:
    name: tests / comparison-and-research
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 30
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run offline comparison, research, and self-test routes
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^(exchange-probe-(compare|research)-tests|binance-ws-race-self-test)$'

  race-semantics-tests:
    name: tests / race-contract-and-semantics
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 45
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run root-integrated contract and semantics tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^exchange-feed-race-(contract|semantics)-tests$'

  race-venue-tests:
    name: tests / race-catalog-and-venues
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 45
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run root-integrated catalog and venue tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^exchange-feed-race-(catalog|venue)-tests$'

  race-transport-tests:
    name: tests / race-transport
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 45
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run root-integrated transport test
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^exchange-feed-race-transport-tests$'

  race-report-tests:
    name: tests / reports-and-reconstruction
    needs: [snapshot, test-build]
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.test-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 45
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run reports and BBO reconstruction tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-incremental --output-on-failure --no-tests=error --timeout 180 -R '^(exchange-feed-race-report-tests|exchange-bbo-reconstruction-tests)$'

  web-build:
    name: web-build
    if: needs.snapshot.outputs.mode == 'own'
    needs: [snapshot, prepare]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 20
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Install locked web dependencies
        working-directory: source/family-ci-v3/CXETCPP/tools/exchange_api_probe/web
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Build web viewer
        working-directory: source/family-ci-v3/CXETCPP/tools/exchange_api_probe/web
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          npm run build

  web-tests:
    name: tests / web-viewer
    if: needs.snapshot.outputs.mode == 'own'
    needs: [snapshot, web-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 15
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Run web viewer tests
        working-directory: source/family-ci-v3/CXETCPP/tools/exchange_api_probe/web
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-incremental"
          npm test

  sanitizer-address-undefined:
    name: sanitizer-address-undefined
    if: >-
      !cancelled() && needs.snapshot.result == 'success' &&
      needs.root-integration-build.result == 'success'
    needs: [snapshot, root-integration-build]
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 240
    defaults: {run: {shell: "/home/gha-runner/github-actions/bin/gha-heavy-shell {0}"}}
    env:
      FAMILY_SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
    steps:
      - name: Configure the real family ASan and UBSan route
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" source --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON"
          /usr/bin/cmake --preset clang-ci-family-address-undefined-incremental -DCXET_EXCHANGE_FEED_RACE_BUILD=ON
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" record --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
      - name: Build instrumented integration tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
          /usr/bin/cmake --build build/modes/clang-ci-family-address-undefined-incremental --parallel 4 --target exchange-bbo-reconstruction-tests exchange-feed-race-contract-tests exchange-feed-race-semantics-tests exchange-feed-race-catalog-tests exchange-feed-race-transport-tests exchange-feed-race-venue-tests exchange-feed-race-report-tests
      - name: Run instrumented integration tests
        working-directory: source/family-ci-v3/CXETCPP
        run: |
          python3 "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/tools/Ci/FamilyCiWorkspace.py" verify --root "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP" --repository "$GITHUB_REPOSITORY" --snapshot-json "$FAMILY_SNAPSHOT_JSON" --build-dir "$GITHUB_WORKSPACE/source/family-ci-v3/CXETCPP/build/modes/clang-ci-family-address-undefined-incremental"
          /usr/bin/ctest --test-dir build/modes/clang-ci-family-address-undefined-incremental --output-on-failure --no-tests=error --timeout 180 -R '^(exchange-bbo-reconstruction-tests|exchange-feed-race-(contract|semantics|catalog|transport|venue|report)-tests)$'

  publish-buildable-own:
    name: publish-buildable-own
    needs: [snapshot, production-build, web-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.snapshot.outputs.mode == 'own' && needs.production-build.result == 'success' && needs.web-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish buildable-own
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-buildable
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-buildable-dependency:
    name: publish-buildable-dependency
    needs: [snapshot, root-integration-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.snapshot.outputs.mode == 'dependency' && needs.root-integration-build.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish buildable-dependency
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-buildable
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-ready:
    name: publish-ready
    needs: [snapshot, prepare, production-build, root-integration-build, web-build, test-build, protocol-tests, safety-tests, research-tests, race-semantics-tests, race-venue-tests, race-transport-tests, race-report-tests, web-tests, sanitizer-address-undefined]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      needs.prepare.result == 'success' &&
      (needs.production-build.result == 'success' || (needs.snapshot.outputs.mode == 'dependency' && needs.production-build.result == 'skipped')) &&
      needs.root-integration-build.result == 'success' &&
      (needs.web-build.result == 'success' || (needs.snapshot.outputs.mode == 'dependency' && needs.web-build.result == 'skipped')) &&
      needs.test-build.result == 'success' &&
      needs.protocol-tests.result == 'success' &&
      needs.safety-tests.result == 'success' &&
      needs.research-tests.result == 'success' &&
      needs.race-semantics-tests.result == 'success' &&
      needs.race-venue-tests.result == 'success' &&
      needs.race-transport-tests.result == 'success' &&
      needs.race-report-tests.result == 'success' &&
      (needs.web-tests.result == 'success' || (needs.snapshot.outputs.mode == 'dependency' && needs.web-tests.result == 'skipped')) &&
      needs.sanitizer-address-undefined.result == 'success'
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish ready
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE"

  publish-build-failed:
    name: publish-build-failed
    needs: [snapshot, prepare, production-build, root-integration-build, web-build]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      (needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled' || needs.production-build.result == 'failure' || needs.production-build.result == 'cancelled' || needs.root-integration-build.result == 'failure' || needs.root-integration-build.result == 'cancelled' || needs.web-build.result == 'failure' || needs.web-build.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish build-failed
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-failed
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE" --failure-kind build

  publish-checks-failed:
    name: publish-checks-failed
    needs: [snapshot, prepare, production-build, root-integration-build, web-build, test-build, protocol-tests, safety-tests, research-tests, race-semantics-tests, race-venue-tests, race-transport-tests, race-report-tests, web-tests, sanitizer-address-undefined]
    if: >-
      always() && github.event_name == 'repository_dispatch' && needs.snapshot.result == 'success' &&
      !(needs.prepare.result == 'failure' || needs.prepare.result == 'cancelled' || needs.production-build.result == 'failure' || needs.production-build.result == 'cancelled' || needs.root-integration-build.result == 'failure' || needs.root-integration-build.result == 'cancelled' || needs.web-build.result == 'failure' || needs.web-build.result == 'cancelled') &&
      (needs.test-build.result == 'failure' || needs.test-build.result == 'cancelled' || needs.protocol-tests.result == 'failure' || needs.protocol-tests.result == 'cancelled' || needs.safety-tests.result == 'failure' || needs.safety-tests.result == 'cancelled' || needs.research-tests.result == 'failure' || needs.research-tests.result == 'cancelled' || needs.race-semantics-tests.result == 'failure' || needs.race-semantics-tests.result == 'cancelled' || needs.race-venue-tests.result == 'failure' || needs.race-venue-tests.result == 'cancelled' || needs.race-transport-tests.result == 'failure' || needs.race-transport-tests.result == 'cancelled' || needs.race-report-tests.result == 'failure' || needs.race-report-tests.result == 'cancelled' || needs.web-tests.result == 'failure' || needs.web-tests.result == 'cancelled' || needs.sanitizer-address-undefined.result == 'failure' || needs.sanitizer-address-undefined.result == 'cancelled')
    runs-on: [self-hosted, linux, x64, wsl, local-control, test-exchanges-helper]
    defaults:
      run: {shell: bash}
    timeout-minutes: 10
    steps:
      - name: Checkout family controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.snapshot.outputs.cxetcpp_sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: tools/Ci
          path: controller
          clean: false
          persist-credentials: false
      - name: Publish checks-failed
        env:
          GH_TOKEN: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          SNAPSHOT_JSON: ${{ needs.snapshot.outputs.snapshot_json }}
          SNAPSHOT_ID: ${{ needs.snapshot.outputs.snapshot_id }}
          CI_MODE: ${{ needs.snapshot.outputs.mode }}
        run: >-
          python3 controller/tools/Ci/FamilyCiController.py publish-failed
          --repository "$GITHUB_REPOSITORY" --snapshot-json "$SNAPSHOT_JSON"
          --snapshot-id "$SNAPSHOT_ID" --mode "$CI_MODE" --failure-kind checks
