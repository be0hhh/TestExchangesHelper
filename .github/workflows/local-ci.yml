name: local-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: /home/gha-runner/github-actions/bin/gha-heavy-shell {0}

env:
  CCACHE_DIR: /home/gha-runner/github-actions/cache/ccache
  CCACHE_MAXSIZE: 15G
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-family-revisions:
    name: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, benchmark, hft-bench, test-exchanges-helper]
    timeout-minutes: 10
    outputs:
      cxetcpp_sha: ${{ steps.snapshot.outputs.cxetcpp_sha }}
    steps:
      - name: Checkout revision resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: main
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          sparse-checkout: .github/actions/resolve-family-revisions
          persist-credentials: false

      - name: Snapshot family main revisions
        id: snapshot
        uses: ./.github/actions/resolve-family-revisions
        with:
          family-read-token: ${{ secrets.CI_FAMILY_READ_TOKEN }}

  standalone-cpp:
    name: standalone-cpp
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 180

    steps:
      - name: Checkout canonical CXET toolchain owner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.resolve-family-revisions.outputs.cxetcpp_sha }}
          path: cxet-root
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          submodules: false
          sparse-checkout: |
            .github/actions/setup-toolchain
            cmake
            tools/Toolchain
          persist-credentials: false

      - name: Checkout probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: cxet-root/tools/exchange_api_probe
          persist-credentials: false

      - name: Record source revisions
        run: |
          {
            echo '### Source revisions'
            printf -- '- CXETCPP: `%s`\n' "$(git -C cxet-root rev-parse HEAD)"
            printf -- '- TestExchangesHelper: `%s`\n' "$(git -C cxet-root/tools/exchange_api_probe rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Set up pinned LLVM
        uses: ./cxet-root/.github/actions/setup-toolchain
        with:
          source-root: cxet-root

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Configure with Unix Makefiles
        working-directory: cxet-root/tools/exchange_api_probe
        run: >-
          /usr/bin/cmake
          -S .
          -B build
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build standalone probe
        working-directory: cxet-root/tools/exchange_api_probe
        run: /usr/bin/cmake --build build --parallel 2

      - name: Run standalone offline tests
        working-directory: cxet-root/tools/exchange_api_probe
        run: /usr/bin/ctest --test-dir build --output-on-failure --no-tests=error

  web:
    name: web-node-22
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 15

    steps:
      - name: Checkout probe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build web viewer
        working-directory: web
        run: npm run build

      - name: Test web viewer
        working-directory: web
        run: npm test

  private-root-integration:
    name: private-root-integration
    needs: resolve-family-revisions
    runs-on: [self-hosted, linux, x64, wsl, local-ci, test-exchanges-helper]
    timeout-minutes: 180

    steps:
      - name: Checkout snapshotted private CXETCPP family
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: be0hhh/CXETCPP
          ref: ${{ needs.resolve-family-revisions.outputs.cxetcpp_sha }}
          path: cxet-root
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          submodules: true
          persist-credentials: false

      - name: Overlay the probe revision under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          token: ${{ secrets.CI_FAMILY_READ_TOKEN }}
          path: cxet-root/tools/exchange_api_probe
          persist-credentials: false

      - name: Verify checkout credentials were removed
        run: |
          for repository_path in \
            "${GITHUB_WORKSPACE}/cxet-root" \
            "${GITHUB_WORKSPACE}/cxet-root/tools/exchange_api_probe"; do
            if git -C "${repository_path}" config --local --get-regexp \
              '^(http\..*\.extraheader|core\.sshCommand)$' >/dev/null 2>&1; then
              echo "::error::Checkout credentials remain configured in ${repository_path}."
              exit 1
            fi
          done

      - name: Record the integrated revisions
        run: |
          root_sha="$(git -C "${GITHUB_WORKSPACE}/cxet-root" rev-parse HEAD)"
          probe_sha="$(git -C "${GITHUB_WORKSPACE}/cxet-root/tools/exchange_api_probe" rev-parse HEAD)"
          {
            echo "### Private CXETCPP integration input"
            echo
            echo "- CXETCPP root: \`${root_sha}\`"
            echo "- Probe requested: \`${GITHUB_SHA}\`"
            echo "- Probe overlaid: \`${probe_sha}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${probe_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::The overlaid probe SHA does not match github.sha."
            exit 1
          fi
          {
            echo '```text'
            git -C "${GITHUB_WORKSPACE}/cxet-root" submodule status
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Set up pinned LLVM
        uses: ./cxet-root/.github/actions/setup-toolchain
        with:
          source-root: cxet-root

      - name: Report CMake and CTest binaries
        run: |
          /usr/bin/cmake --version
          /usr/bin/ctest --version

      - name: Configure the canonical root graph with probe integration
        working-directory: cxet-root
        run: >-
          /usr/bin/cmake
          --preset clang-ci-family
          -DCXET_EXCHANGE_FEED_RACE_BUILD=ON

      - name: Build the offline probe integration targets
        working-directory: cxet-root
        run: |
          /usr/bin/cmake --build --preset clang-ci-family \
            --parallel 4 \
            --target \
              exchange-bbo-reconstruction-tests \
              exchange-feed-race-contract-tests \
              exchange-feed-race-semantics-tests \
              exchange-feed-race-catalog-tests \
              exchange-feed-race-transport-tests \
              exchange-feed-race-venue-tests \
              exchange-feed-race-report-tests

      - name: Run the offline probe integration tests
        working-directory: cxet-root
        run: >-
          /usr/bin/ctest
          --test-dir build/modes/clang-ci-family
          --output-on-failure
          --no-tests=error
          --timeout 180
          --parallel 4
          --tests-regex
          '^(exchange-bbo-reconstruction-tests|exchange-feed-race-(contract|semantics|catalog|transport|venue|report)-tests)$'
